name: Nightly

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check for recent commits
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.decide.outputs.should-build }}
      nightly-version: ${{ steps.version.outputs.nightly-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — building."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "Commits found in last 24h — building."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits in last 24h — skipping nightly."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          fi

      - id: version
        shell: bash
        run: |
          # Semver sorts a prerelease BELOW its own release: 0.4.1-nightly.x
          # < 0.4.1. Stamping package.json's current version therefore builds
          # a nightly that the matching stable release overtakes the moment it
          # ships, and an installed nightly quietly walks back to stable on the
          # next check. Bump the patch first so nightly always sorts above the
          # newest tagged release: 0.4.2-nightly.x > 0.4.1.
          NEXT_VERSION=$(node -p "const v=require('./package.json').version.split('-')[0].split('.').map(Number); v[2]+=1; v.join('.')")
          DATE=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short "${GITHUB_SHA}")
          echo "nightly-version=${NEXT_VERSION}-nightly.${DATE}.${SHA}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: check
    if: needs.check.outputs.should-build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned rather than macos-latest, matching overcli: the macos-26
          # image that rolled on 2026-08-31 fails signing at
          # `security set-key-partition-list` (the temp keychain
          # electron-builder creates no longer unlocks). Revisit when a later
          # image or electron-builder release fixes it.
          - os: macos-15
            dist_script: dist:mac
          - os: windows-latest
            dist_script: dist:win
          - os: ubuntu-latest
            dist_script: dist:linux

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp nightly version and publish channel
        shell: bash
        run: |
          # `channel` has to be set on the publish config, not inferred.
          # electron-builder only derives a channel from the version's
          # prerelease tag for the `generic` provider; for github it falls
          # back to `latest`. Without this the nightly release ships
          # latest*.yml — claiming to be the stable feed — and no
          # nightly*.yml at all.
          node -e "
            const fs = require('fs');
            const p = require('./package.json');
            p.version = '${{ needs.check.outputs.nightly-version }}';
            p.build.publish = p.build.publish.map((e) => ({ ...e, channel: 'nightly' }));
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('version =', p.version);
          "

      # Signed when the Apple secrets are available, but not notarized:
      # notarization is a ~15-minute Apple round-trip that only affects the
      # first manual download's Gatekeeper prompt. Stable releases
      # (release.yml) stay notarized. Same trade-off as overcli's nightly.
      - name: Build distributables
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing credentials. Read from org-level secrets shared with
          # overcli (or repo-level ones, which take precedence). When they
          # are absent the build still succeeds, unsigned, as before.
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CSC_LINK" ]; then
            echo "Apple credentials detected — building signed + notarized."
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "No Apple credentials in secrets — building unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm run ${{ matrix.dist_script }} -- -c.mac.notarize=false --publish never
          else
            npm run ${{ matrix.dist_script }} -- --publish never
          fi

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overgit-nightly-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
          if-no-files-found: ignore
          retention-days: 1

  release:
    name: Publish nightly release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create stable-named copies
        shell: bash
        run: |
          mkdir -p stable
          shopt -s nullglob
          cd artifacts
          for f in *; do
            case "$f" in
              *arm64*.zip)      cp "$f" "../stable/Overgit-nightly-mac-arm64.zip" ;;
              *.zip)            cp "$f" "../stable/Overgit-nightly-mac-x64.zip" ;;
              *arm64*.dmg)      cp "$f" "../stable/Overgit-nightly-mac-arm64.dmg" ;;
              *.dmg)            cp "$f" "../stable/Overgit-nightly-mac-x64.dmg" ;;
              *arm64*.exe)      cp "$f" "../stable/Overgit-nightly-win-arm64.exe" ;;
              *.exe)            cp "$f" "../stable/Overgit-nightly-win-x64.exe" ;;
              *arm64.AppImage)  cp "$f" "../stable/Overgit-nightly-linux-arm64.AppImage" ;;
              *.AppImage)       cp "$f" "../stable/Overgit-nightly-linux-x64.AppImage" ;;
              *arm64.deb)       cp "$f" "../stable/Overgit-nightly-linux-arm64.deb" ;;
              *amd64.deb)       cp "$f" "../stable/Overgit-nightly-linux-x64.deb" ;;
            esac
          done
          echo "Stable copies:"
          ls -la ../stable

      - name: Move nightly tag to current commit
        run: |
          git tag -f nightly
          git push origin nightly --force

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # A semver tag per build: electron-updater reads the version off
          # the release tag, so a bare `nightly` tag is invisible to it.
          # The movable `nightly` git tag above still marks the source.
          tag_name: v${{ needs.check.outputs.nightly-version }}
          name: Nightly
          prerelease: true
          fail_on_unmatched_files: false
          body: |
            Auto-built nightly from commit `${{ github.sha }}`.

            **Downloads** for this nightly:
            - macOS (Apple Silicon): [`Overgit-nightly-mac-arm64.dmg`](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check.outputs.nightly-version }}/Overgit-nightly-mac-arm64.dmg)
            - macOS (Intel): [`Overgit-nightly-mac-x64.dmg`](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check.outputs.nightly-version }}/Overgit-nightly-mac-x64.dmg)
            - Windows (x64): [`Overgit-nightly-win-x64.exe`](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check.outputs.nightly-version }}/Overgit-nightly-win-x64.exe)
            - Windows (ARM64): [`Overgit-nightly-win-arm64.exe`](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check.outputs.nightly-version }}/Overgit-nightly-win-arm64.exe)
            - Linux (x64 AppImage): [`Overgit-nightly-linux-x64.AppImage`](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check.outputs.nightly-version }}/Overgit-nightly-linux-x64.AppImage)
            - Linux (ARM64 AppImage): [`Overgit-nightly-linux-arm64.AppImage`](https://github.com/${{ github.repository }}/releases/download/v${{ needs.check.outputs.nightly-version }}/Overgit-nightly-linux-arm64.AppImage)

            > Pre-release. On macOS, nightlies are signed with the Developer ID when the
            > signing secrets are configured, but not notarized, so Gatekeeper may still
            > warn on first launch (right-click → Open).
          files: |
            artifacts/*
            stable/*

      # Only the newest nightly should exist, so the nightly feed resolves to
      # exactly one build. Also removes the pre-updater release that lived on
      # the bare `nightly` tag (deleting a release leaves its git tag alone).
      - name: Remove older nightly prereleases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: v${{ needs.check.outputs.nightly-version }}
        run: |
          gh release delete nightly --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isDraft,isPrerelease --jq '.[] | select(.isPrerelease == true and .isDraft == false) | .tagName' \
            | while read -r tag; do
                if [[ "$tag" == v*-nightly.* && "$tag" != "$CURRENT_TAG" ]]; then
                  gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
                fi
              done
