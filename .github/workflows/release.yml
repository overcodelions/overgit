name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist_script: dist:mac
          - os: windows-latest
            dist_script: dist:win
          - os: ubuntu-latest
            dist_script: dist:linux

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # electron-builder picks GH_TOKEN up automatically and will attach
      # the produced artifacts to the GitHub Release for the pushed tag.
      # Code signing / notarization is intentionally not configured —
      # users on macOS will need to right-click → Open the first time.
      - name: Build distributables
        run: npm run ${{ matrix.dist_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable electron-builder's macOS code signing attempts.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts (workflow run)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overgit-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

      # On tag pushes, attach the per-platform artifacts to the GitHub
      # Release for that tag. Each matrix job uploads its own files to
      # the same Release; softprops/action-gh-release creates the Release
      # on first run and appends on later runs.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
