<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws://localhost:5273 http://localhost:5273; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>overgit</title>
    <!-- Boot loader: shown inside #root until React mounts and replaces it
         (the dev server can take a few seconds to serve the first bundle).
         Pure CSS/SVG because the CSP disallows inline scripts. -->
    <style>
      /* The window is always dark at launch, whatever the OS theme. */
      .boot-loader { --boot-ink: #ececf1; --boot-muted: rgba(236, 236, 241, 0.5); --boot-track: rgba(236, 236, 241, 0.1); }
      .boot-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--boot-ink); opacity: 0; animation: boot-fade-in 400ms ease-out 200ms forwards; -webkit-app-region: drag; }
      .boot-loader__mark { width: 44px; height: 44px; overflow: visible; animation: boot-breathe 2.4s ease-in-out 1.1s infinite; }
      .boot-loader__stroke { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .boot-loader__stroke > * { stroke-dasharray: 1; stroke-dashoffset: 1; animation: boot-draw 700ms cubic-bezier(0.65, 0, 0.35, 1) forwards; }
      .boot-loader__stroke > :nth-child(2) { animation-delay: 120ms; }
      .boot-loader__stroke > :nth-child(3) { animation-delay: 240ms; }
      .boot-loader__dots circle { fill: currentColor; transform-box: fill-box; transform-origin: center; transform: scale(0); animation: boot-pop 420ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
      .boot-loader__dots circle:nth-child(1) { animation-delay: 300ms; }
      .boot-loader__dots circle:nth-child(2) { animation-delay: 420ms; }
      .boot-loader__dots circle:nth-child(3) { animation-delay: 540ms; }
      .boot-loader__name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
      .boot-loader__bar { position: relative; width: 96px; height: 2px; border-radius: 1px; overflow: hidden; background: var(--boot-track); }
      .boot-loader__bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: inherit; background: var(--boot-muted); animation: boot-slide 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      @keyframes boot-fade-in { to { opacity: 1; } }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-pop { to { transform: scale(1); } }
      @keyframes boot-breathe { 50% { opacity: 0.55; } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader__mark, .boot-loader__stroke > *, .boot-loader__dots circle { animation: none; stroke-dashoffset: 0; transform: none; }
        .boot-loader__bar::after { width: 100%; animation: boot-breathe 2.4s ease-in-out infinite; }
      }
    </style>
  </head>
  <body class="dark">
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Loading overgit">
        <svg class="boot-loader__mark" viewBox="192 192 640 640" aria-hidden="true">
          <g class="boot-loader__stroke" stroke-width="88">
            <line pathLength="1" x1="330" y1="290" x2="330" y2="734" />
            <line pathLength="1" x1="330" y1="512" x2="700" y2="512" />
          </g>
          <g class="boot-loader__dots">
            <circle cx="330" cy="290" r="92" />
            <circle cx="330" cy="734" r="92" />
            <circle cx="700" cy="512" r="92" />
          </g>
        </svg>
        <div class="boot-loader__name">overgit</div>
        <div class="boot-loader__bar"></div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
