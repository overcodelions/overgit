<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- icon.svg redrawn for 16-32px: the ring nodes' holes close up once
       downscaled, so the nodes are solid dots here, with heavier strokes
       and a slightly bigger graph. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f1ed"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect x="100" y="122" width="824" height="824" rx="185" ry="185" fill="#000000" fill-opacity="0.32" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#plate)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" ry="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g stroke="#111113" stroke-width="88" stroke-linecap="round">
    <line x1="330" y1="290" x2="330" y2="734"/>
    <line x1="330" y1="512" x2="700" y2="512"/>
  </g>
  <g fill="#111113">
    <circle cx="330" cy="290" r="92"/>
    <circle cx="330" cy="734" r="92"/>
    <circle cx="700" cy="512" r="92"/>
  </g>
</svg>
